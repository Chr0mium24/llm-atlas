<h2 id="plan">计划内容</h2>
<ul>
  <li>三个机制：目标冲突、浅层对齐（只有几个 token 深）、拒绝是一个方向</li>
  <li>攻击分类：优化后缀、多轮渐进、长上下文、采样暴力、微调、权重编辑、提示注入</li>
  <li>量级：多轮攻击在闭源旗舰上的成功率</li>
  <li>防御演进：对抗训练 → 表示层 → 分类器级联 → 数据过滤 → 架构隔离（CaMeL）</li>
  <li>开源模型能不能防篡改</li>
</ul>
